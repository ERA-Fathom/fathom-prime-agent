[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom-prime-agent"
version = "0.1.0"
description = "Read Prime Agent sessions, root and children, with the fathom read."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["fathom-read>=0.4"]

[project.scripts]
prime-fathom = "prime_fathom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
