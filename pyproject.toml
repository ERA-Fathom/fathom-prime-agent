[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "right-rudder-prime-agent"
version = "0.2.0"
description = "Read Prime Agent sessions, root and children, with the Right Rudder read."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["right-rudder>=0.7.0"]

[project.scripts]
prime-right-rudder = "prime_right_rudder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
